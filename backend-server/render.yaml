services:
  - type: web
    name: gym-posture-backend
    env: docker
    region: ohio
    plan: free
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 8000
      - key: JWT_SECRET_KEY
        generateValue: true   # Render auto-generates a strong secret on first deploy
      - key: NVIDIA_API_KEY
        sync: false           # Must be set manually in the Render dashboard
